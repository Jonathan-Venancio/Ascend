[tool.poetry]
name = "ascend-backend"
version = "0.1.0"
description = "Backend API for the Ascend gamification system"
authors = ["Jonathan"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.135.2"
uvicorn = { version = "0.24.0", extras = ["standard"] }
sqlalchemy = "^2.0.36"
psycopg2-binary = "^2.9.10"
python-jose = { version = "3.3.0", extras = ["cryptography"] }
passlib = { version = "1.7.4", extras = ["bcrypt"] }
bcrypt = "4.0.1"
python-multipart = "0.0.6"
email-validator = "^2.2.0"
pydantic = "2.12.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.taskipy.tasks]
backend = { cmd = "uvicorn main:app --reload --host 0.0.0.0 --port 8000", help = "Sobe o servidor backend (dev)" }
frontend = { cmd = "npm run dev -- --host", cwd = "../AscendFrontend", help = "Sobe o servidor frontend (dev)" }
run = { cmd = "python scripts/dev_run.py", help = "Abre dois terminais: backend e frontend" }
